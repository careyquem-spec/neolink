name: Windows build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install GStreamer
        run: |
          $v = '1.26.7'
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$v/msvc"
          $sum = $env:GITHUB_STEP_SUMMARY
          foreach ($f in "gstreamer-1.0-msvc-x86_64-$v.msi", "gstreamer-1.0-devel-msvc-x86_64-$v.msi") {
            Invoke-WebRequest "$base/$f" -OutFile $f
            $log = "$f.log"
            $p = Start-Process msiexec.exe -ArgumentList '/i', $f, '/qn', '/norestart', 'ADDLOCAL=ALL', '/l*', $log -Wait -PassThru
            "msiexec $f exit $($p.ExitCode)" | Tee-Object -FilePath $sum -Append
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              '```' | Out-File $sum -Append; Get-Content $log -Tail 40 | Out-File $sum -Append; '```' | Out-File $sum -Append
              throw "msiexec $f failed with $($p.ExitCode)"
            }
          }
          $candidates = @(
            "$env:ProgramFiles\gstreamer\1.0\msvc_x86_64",
            "$env:SYSTEMDRIVE\gstreamer\1.0\msvc_x86_64",
            'D:\gstreamer\1.0\msvc_x86_64'
          )
          $root = $candidates | Where-Object { Test-Path "$_\lib\pkgconfig\gstreamer-1.0.pc" } | Select-Object -First 1
          "candidates: $($candidates | ForEach-Object { "$_=$(Test-Path $_)" })" | Tee-Object -FilePath $sum -Append
          if (-not $root) {
            $found = Get-ChildItem -Path "$env:ProgramFiles", "$env:SYSTEMDRIVE\gstreamer" -Filter 'gstreamer-1.0.pc' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 3 -ExpandProperty FullName
            "search: $found" | Tee-Object -FilePath $sum -Append
            throw 'gstreamer-1.0.pc not found'
          }
          "GStreamer root: $root; pkg-config: $(Test-Path "$root\bin\pkg-config.exe")" | Tee-Object -FilePath $sum -Append
          Add-Content -Path $env:GITHUB_ENV -Value "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root\"
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$root\lib\pkgconfig"
          Add-Content -Path $env:GITHUB_PATH -Value "$root\bin"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.72.0"
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          { echo '### Build errors'; echo '```'; grep -E -A 12 '^(error|warning: build failed)' build.log | head -150; tail -30 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: neolink-windows
          path: target/release/neolink.exe
